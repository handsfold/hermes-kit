  external_dirs:
  - $HOME/.agents/skills
  inline_shell: false
  inline_shell_timeout: 10
  template_vars: true
smart_model_routing:
  enabled: false
  max_simple_chars: 160
  max_simple_words: 28
streaming:
  enabled: true
stt:
  enabled: true
  language: fr
  local:
    language: fr
    model: base
  mistral:
    model: voxtral-mini-latest
  openai:
    model: whisper-1
  provider: local_command
terminal:
  auto_source_bashrc: true
  backend: local
  container_cpu: 2.0
  container_disk: 51200
  container_memory: 5120
  container_persistent: true
  cwd: $HOME/.hermes/workspace
  docker_forward_env: []
  docker_mount_cwd_to_workspace: false
  docker_volumes: []
  env_passthrough: []
  lifetime_seconds: 300
  modal_mode: auto
  persistent_shell: true
  shell_init_files: []
  timeout: 180
timezone: ''
toolsets:
- code_execution
- cronjob
- delegation
- file
- memory
- session_search
- skills
- terminal
- todo
- vision
- web
- code-gratuit
tts:
  edge:
    voice: fr-FR-HenriNeural
  elevenlabs:
    model_id: eleven_multilingual_v2
    voice_id: pNInz6obpgDQGcFmaJgB
  mistral:
    model: voxtral-mini-tts-2603
    voice_id: c69964a6-ab8b-4f8a-9465-ec0925096ec8
  neutts:
    device: cpu
    model: neuphonic/neutts-air-q4-gguf
    ref_audio: ''
    ref_text: ''
  openai:
    model: gpt-4o-mini-tts
    voice: alloy
  provider: secours
  providers:
    secours:
      command: $HOME/.hermes/scripts/tts-secours.sh {input_path} 
        {output_path}
      format: ogg
      type: command
      voice_compatible: true
  stt:
    enabled: true
    language: fr
    local:
      enabled: false
    mistral:
      model: voxtral-mini-latest
    model: whisper-1
    openai:
      base_url: https://api.groq.com/openai/v1
      model: whisper-1
    provider: openai
  use_gateway: true
  xai:
    bit_rate: 128000
    language: en
    sample_rate: 24000
    voice_id: eve
voice:
  auto_tts: false
  beep_enabled: true
  max_recording_seconds: 120
  record_key: ""  # a renseigner
  silence_duration: 3.0
  silence_threshold: 200
web:
  search_backend: searxng
